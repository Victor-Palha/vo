services:
  vo-db:
    container_name: vo-postgres
    image: postgres:17
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_DB=vo_dev
      - POSTGRES_PASSWORD=docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d vo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vo-data:/var/lib/postgresql/data
    networks:
      - vo-network

volumes:
  vo-data:
    driver: local

networks:
  vo-network:
    driver: bridge
